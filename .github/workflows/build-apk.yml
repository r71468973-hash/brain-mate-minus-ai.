
name: Build Brain Mate Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Brain Mate APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --update
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Web App
        run: |
          test -f index.html || {
            echo "ERROR: index.html is missing from repository root."
            exit 1
          }

          mkdir -p www
          cp index.html www/index.html

          if [ -d assets ]; then cp -r assets www/; fi
          if [ -d css ]; then cp -r css www/; fi
          if [ -d js ]; then cp -r js www/; fi
          if [ -d images ]; then cp -r images www/; fi

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.brainmate.ai",
            "appName": "Brain Mate",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Android Project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify and Rename APK
        run: |
          mkdir -p output
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find android/app/build/outputs -type f || true
            exit 1
          fi

          cp "$APK" output/Brain-Mate.apk
          ls -lh output/Brain-Mate.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Brain-Mate-APK
          path: output/Brain-Mate.apk
          if-no-files-found: error
          retention-days: 30
          
