name: Build Brain Mate Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Brain Mate APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK & Accept Licenses
        run: |
          # Add SDK commandline tools and platform-tools to PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/tools:$ANDROID_HOME/tools/bin:$PATH"

          # Pre-accept all Android SDK licenses by writing license hashes
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "89337d0c0b383669be1f86026653cc9a1441c5ac" >> "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true

          # Run sdkmanager to accept any additional licenses
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Prepare Web Assets & Install Dependencies
        run: |
          test -f index.html || {
            echo "ERROR: index.html is missing from repository root."
            exit 1
          }

          if [ -f package.json ]; then
            echo "package.json found. Installing dependencies..."
            if [ -f package-lock.json ]; then
              echo "Valid package-lock.json found. Using npm ci..."
              npm ci --legacy-peer-deps || npm install --legacy-peer-deps
            else
              echo "package-lock.json missing. Using npm install..."
              npm install --legacy-peer-deps
            fi

            # Build production web bundle if build script exists
            if grep -q '"build"' package.json; then
              echo "Building web bundle via npm run build..."
              npm run build
            else
              mkdir -p dist
              cp -r index.html dist/
            fi
          else
            echo "Standalone index.html repository detected. Preparing dist directory..."
            mkdir -p dist
            cp -r index.html dist/
            if [ -d public ]; then cp -r public/* dist/ 2>/dev/null || true; fi
            if [ -d assets ]; then cp -r assets dist/ 2>/dev/null || true; fi
            if [ -d css ]; then cp -r css dist/ 2>/dev/null || true; fi
            if [ -d js ]; then cp -r js dist/ 2>/dev/null || true; fi
            if [ -d images ]; then cp -r images dist/ 2>/dev/null || true; fi

            echo "Initializing npm and installing Capacitor dependencies..."
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          fi

      - name: Configure Capacitor
        run: |
          # Ensure capacitor.config.json exists and preserves Brain Mate settings
          if [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.brainmate.ai",
            "appName": "Brain Mate",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": true
            }
          }
          EOF
          fi

      - name: Setup & Sync Android Platform
        run: |
          # Add android platform only if native folder does not already exist
          if [ ! -d android ] || [ ! -f android/gradlew ]; then
            echo "Initializing Android native project..."
            npx cap add android
          else
            echo "Existing Android native project detected. Skipping add..."
          fi

          echo "Synchronizing web assets with Capacitor Android..."
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and Prepare APK
        run: |
          mkdir -p output
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find android/app/build/outputs -type f || true
            exit 1
          fi

          echo "Found APK: $APK"
          cp "$APK" output/Brain-Mate.apk
          ls -lh output/Brain-Mate.apk

      - name: Upload Brain Mate APK
        uses: actions/upload-artifact@v4
        with:
          name: Brain-Mate-APK
          path: output/Brain-Mate.apk
          if-no-files-found: error
          retention-days: 30
          
