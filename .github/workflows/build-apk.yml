name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor Android Tools
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Build Release APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build Android App Bundle (AAB) for Play Store
        working-directory: ./android
        run: |
          ./gradlew bundleRelease

      - name: Sign Release APK (Debug keystore fallback for testing)
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 android/app/build/outputs/apk/release/app-release-unsigned.apk brain-mate-aligned.apk || cp android/app/build/outputs/apk/release/app-release-unsigned.apk brain-mate-aligned.apk
          keytool -genkey -v -keystore release.keystore -alias brainmate -keyalg RSA -keysize 2048 -validity 10000 -storepass brainmate123 -keypass brainmate123 -dname "CN=BrainMate, OU=AI, O=BrainMate, L=Mumbai, S=MH, C=IN"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:brainmate123 --key-pass pass:brainmate123 --out brain-mate-release.apk brain-mate-aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brain-Mate-Release-APK
          path: brain-mate-release.apk
          retention-days: 30

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brain-Mate-Google-Play-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
