
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Mate APK Builder</title>
<style>
body{margin:0;padding:20px;background:#101827;color:#fff;font-family:Arial,sans-serif}
.card{max-width:700px;margin:auto;background:#1b2942;padding:20px;border-radius:16px}
h2{color:#60a5fa}
p{color:#cbd5e1;line-height:1.6}
button{width:100%;padding:15px;background:#2563eb;color:white;border:0;border-radius:10px;font-size:16px;margin:8px 0}
textarea{width:100%;height:300px;box-sizing:border-box;background:#0b1220;color:#d1fae5;padding:12px;border-radius:10px;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h2>Brain Mate APK Builder</h2>
<p>Android SDK setup fix — Workflow code</p>
<button onclick="copyCode()">Copy Workflow Code</button>
<textarea id="code" spellcheck="false">      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDK" ]; then
            SDK=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi

          if [ ! -f "$SDK" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDK" --licenses || true

          "$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
</textarea>
<p>इस कोड को अपनी पुरानी Workflow फ़ाइल में Android SDK वाले दोनों स्टेप की जगह डालें।</p>
</div>
<script>
function copyCode(){
const t=document.getElementById('code');
t.select();
t.setSelectionRange(0,99999);
if(navigator.clipboard && window.isSecureContext){
navigator.clipboard.writeText(t.value)
.then(()=>alert('Workflow code copied!'))
.catch(()=>fallback(t));
}else{fallback(t);}
}
function fallback(t){
if(document.execCommand('copy')) alert('Workflow code copied!');
else alert('कोड को select करके Copy दबाएँ।');
}
</script>
</body>
</html>
