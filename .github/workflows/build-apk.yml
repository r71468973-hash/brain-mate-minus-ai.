l
name: Build Brain Mate Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Brain Mate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          ndk-version: 21.4.7075529

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            npm init -y
          fi

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Configure Brain Mate
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.name='brain-mate';p.version=p.version||'1.0.0';p.scripts={...(p.scripts||{}),build:p.scripts?.build||'echo Web build ready'};fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            echo '{"appId":"com.brainmate.ai","appName":"Brain Mate","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          fi
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
          elif [ ! -f www/index.html ]; then
            echo '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><h1>Brain Mate</h1></body></html>' > www/index.html
          fi

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Brain Mate APK
        uses: actions/upload-artifact@v4
        with:
          name: Brain-Mate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


          
