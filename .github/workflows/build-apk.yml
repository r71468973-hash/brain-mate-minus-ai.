name: Build Brain Mate Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Brain Mate APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK & Accept Licenses
        run: |
          set -e
          echo "Setting up Android SDK environment and pre-accepting licenses..."
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/tools:$ANDROID_HOME/tools/bin:$PATH"

          # Write all official Android SDK license hashes directly to prevent any interactive prompt
          for TARGET_DIR in "$ANDROID_HOME/licenses" "/usr/local/lib/android/sdk/licenses" "$HOME/Android/Sdk/licenses"; do
            mkdir -p "$TARGET_DIR" 2>/dev/null || true
            cat << 'EOF' > "$TARGET_DIR/android-sdk-license"
24333f8a63b6825ea9c5514f83c2829b004d1fee
d56f5187479451eabf01fb78af6dfcb131a6481e
89337d0c0b383669be1f86026653cc9a1441c5ac
EOF
            cat << 'EOF' > "$TARGET_DIR/android-sdk-preview-license"
84831b9409646a918e30573bab4c9c91346d8abd
7994509e9f104fd77e793000e37e6377c4e6f424
EOF
            cat << 'EOF' > "$TARGET_DIR/android-googletv-license"
601085b94cd77f0b54ff86406957099fed7926d4
EOF
            cat << 'EOF' > "$TARGET_DIR/android-sdk-arm-dbt-license"
859f317696f67ef3d7f30a50a5560e7834b43903
EOF
            cat << 'EOF' > "$TARGET_DIR/google-gdk-license"
33b6a2b64607f11b759f320ef9dff4ae5c47d97a
EOF
            cat << 'EOF' > "$TARGET_DIR/mips-android-sysimage-license"
e9acab587f1749c4cb817d2662454b84e3347518
EOF
          done
          echo "All Android SDK licenses have been pre-accepted on filesystem."

      - name: Install Android SDK Packages
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          # Non-interactively verify required platform-tools and build-tools
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            printf 'y\n%.0s' {1..30} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi
          echo "Android SDK packages ready."

      - name: Prepare Web Assets and Dependencies
        run: |
          test -f index.html || {
            echo "ERROR: index.html is missing from repository root."
            exit 1
          }

          if [ -f package.json ]; then
            echo "package.json found."
            if [ -f package-lock.json ]; then
              echo "Valid package-lock.json found. Running npm ci..."
              npm ci --legacy-peer-deps || npm install --legacy-peer-deps
            else
              echo "package-lock.json missing. Running npm install..."
              npm install --legacy-peer-deps
            fi

            # Build production web bundle if build script exists
            if grep -q '"build"' package.json; then
              echo "Building web bundle via npm run build..."
              npm run build
            else
              mkdir -p dist
              cp -r index.html dist/
            fi
          else
            echo "Standalone index.html repository detected. Preparing dist directory..."
            mkdir -p dist
            cp -r index.html dist/
            if [ -d public ]; then cp -r public/* dist/ 2>/dev/null || true; fi
            if [ -d assets ]; then cp -r assets dist/ 2>/dev/null || true; fi
            if [ -d css ]; then cp -r css dist/ 2>/dev/null || true; fi
            if [ -d js ]; then cp -r js dist/ 2>/dev/null || true; fi
            if [ -d images ]; then cp -r images dist/ 2>/dev/null || true; fi

            echo "Initializing npm package and installing Capacitor..."
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          fi

      - name: Configure Capacitor
        run: |
          # Ensure capacitor.config.json exists and preserves Brain Mate settings
          if [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.brainmate.ai",
            "appName": "Brain Mate",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": true
            }
          }
          EOF
          fi

      - name: Add Android Platform & Sync
        run: |
          # Add android platform only if native project does not already exist
          if [ ! -d android ] || [ ! -f android/gradlew ]; then
            echo "Adding Android native project..."
            npx cap add android
          else
            echo "Existing Android native project detected. Skipping add..."
          fi

          echo "Synchronizing web assets with Capacitor Android..."
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          mkdir -p output
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find android/app/build/outputs -type f || true
            exit 1
          fi

          echo "Found generated APK: $APK"
          cp "$APK" output/Brain-Mate.apk
          ls -lh output/Brain-Mate.apk

      - name: Upload Brain Mate APK
        uses: actions/upload-artifact@v4
        with:
          name: Brain-Mate-APK
          path: output/Brain-Mate.apk
          if-no-files-found: error
          retention-days: 30
