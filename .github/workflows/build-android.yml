
name: Build Brain Mate Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Brain Mate APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Prepare Web Assets and Dependencies
        run: |
          test -f index.html || (echo "ERROR: index.html missing" && exit 1)
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6

      - name: Configure Capacitor
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('capacitor.config.json',JSON.stringify({appId:'com.brainmate.ai',appName:'Brain Mate',webDir:'.',server:{androidScheme:'https'}},null,2))"
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Brain Mate APK
        uses: actions/upload-artifact@v4
        with:
          name: Brain-Mate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


